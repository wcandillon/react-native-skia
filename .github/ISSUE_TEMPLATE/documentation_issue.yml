name: 📖 Documentation issue
description: Report an issue with React Native Skia documentation
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        We happily accept contributions made with coding agents. But first, we want to hear from you and your own words. After that, agent-written content is welcomed. See [Contributing with coding agents](https://github.com/wcandillon/react-native-skia/blob/main/packages/skia/CONTRIBUTING.md#contributing-with-coding-agents).

  - type: textarea
    id: own_words
    attributes:
      label: In your own words
      description: What were you trying to do, and what in the documentation is wrong, missing, or confusing? Did you run into this yourself, or did it come up in an audit? A partial understanding is fine.
    validations:
      required: true

  - type: textarea
    id: agent_content
    attributes:
      label: Agent-written content
      description: Optional. If a coding agent was involved, paste its analysis, root cause investigation, or proposed fix here.
    validations:
      required: false
