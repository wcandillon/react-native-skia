name: 🐛 Bug Report
description: Report a reproducible bug or regression in React Native Skia
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide all the information requested. Issues that do not follow this format are likely to stall.
        Write this issue yourself first, in your own words. A partial understanding is fine; what matters is that you own the problem. Agentic content after that is welcome. See [Contributing with coding agents](https://github.com/wcandillon/react-native-skia/blob/main/packages/skia/CONTRIBUTING.md#contributing-with-coding-agents).
        
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Briefly describe the issue and the expected versus actual behavior.
        Start with what you or your users see (a crash, a freeze, a visual glitch, memory growth), on which device and OS version. You do not need to understand the cause; if you have an analysis of the code, add it after.
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: How did you run into this?
      description: Every kind of report is welcome, but we prioritize them differently.
      options:
        - It happens in my app, in production
        - It happens in my app, during development
        - I can reproduce it in a test project or the example app, but my app is not affected
        - I found it by reading the code or running an automated audit, and have not seen it happen
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: How much of a pain point is this for you?
      description: |
        This is the context only you have, and it is extremely useful to us even if you do not understand the problem.
        What were you building when you hit it? How often does it happen, and for how many of your users? Is it blocking you, or do you have a workaround, and what does it cost? "It does not affect me" is a fine answer.
    validations:
      required: true

  - type: input
    id: skia_version
    attributes:
      label: React Native Skia Version
      description: Specify the version of react-native-skia where the issue occurs.
    validations:
      required: true

  - type: input
    id: react_native_version
    attributes:
      label: React Native Version
      description: Specify the version of React Native used.
    validations:
      required: true

  - type: checkboxes
    id: new_architecture
    attributes:
      label: Using New Architecture
      description: Check this box if the new architecture is enabled.
      options:
        - label: Enabled
          required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a detailed list of steps that reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Snack, Code Example, Screenshot, or Link to Repository
      description: |
        Please provide a Snack (https://snack.expo.io/), a link to a repository on GitHub, or a minimal code example that reproduces the problem.
        You may provide a screenshot of the application if you think it is relevant to your bug report.
        Here are some tips for providing a minimal example: https://stackoverflow.com/help/mcve.
        A reproducer is mandatory. Issues without reproducers are more likely to stall and may be closed.
    validations:
      required: true
