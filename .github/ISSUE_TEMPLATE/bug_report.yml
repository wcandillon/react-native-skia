name: 🐛 Bug Report
description: Report a reproducible bug or regression in React Native Skia
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide all the information requested. Issues that do not follow this format are likely to stall.
        We happily accept contributions made with coding agents. But first, we want to hear from you directly. After that, agent-written content is welcome. See [Contributing with coding agents](https://github.com/wcandillon/react-native-skia/blob/main/packages/skia/CONTRIBUTING.md#contributing-with-coding-agents).
        
  - type: textarea
    id: own_words
    attributes:
      label: Description
      description: >-
        In your own words (not paraphrased by the agent): how did you come across the problem? Did you experience it yourself, or did it come up in an audit? How much of a pain point is it? What did you expect versus what happened, and what is your own understanding of the issue? A partial understanding is fine.
    validations:
      required: true

  - type: input
    id: skia_version
    attributes:
      label: React Native Skia Version
      description: Specify the version of react-native-skia where the issue occurs.
    validations:
      required: true

  - type: input
    id: react_native_version
    attributes:
      label: React Native Version
      description: Specify the version of React Native used.
    validations:
      required: true

  - type: checkboxes
    id: new_architecture
    attributes:
      label: Using New Architecture
      description: Check this box if the new architecture is enabled.
      options:
        - label: Enabled
          required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a detailed list of steps that reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Snack, Code Example, Screenshot, or Link to Repository
      description: |
        Please provide a Snack (https://snack.expo.io/), a link to a repository on GitHub, or a minimal code example that reproduces the problem.
        You may provide a screenshot of the application if you think it is relevant to your bug report.
        Here are some tips for providing a minimal example: https://stackoverflow.com/help/mcve.
        A reproducer is mandatory. Issues without reproducers are more likely to stall and may be closed.
    validations:
      required: true

  - type: textarea
    id: agent_content
    attributes:
      label: Agent-written content
      description: Optional. If a coding agent was involved, paste its analysis, root cause investigation, or proposed fix here.
    validations:
      required: false
