name: 🆕 Feature Request
description: React Native Skia feature request
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write this issue yourself first, in your own words. A partial understanding is fine; what matters is that you own the problem. Agentic content after that is welcome. See [Contributing with coding agents](https://github.com/wcandillon/react-native-skia/blob/main/packages/skia/CONTRIBUTING.md#contributing-with-coding-agents).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see in React Native Skia?
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: What are you building, and how much does this matter to you?
      description: |
        Tell us about the app or the effect you need this for, what you do today without it, and what that workaround costs you. A concrete use case helps us more than a detailed design.
    validations:
      required: true