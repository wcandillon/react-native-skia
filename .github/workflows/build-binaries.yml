name: Release binaries
# Builds Skia Graphite and the Dawn it pins and publishes them as the assets of
# the GitHub release binaries-<version>, which the native build systems
# download from, all in one run. A dry run (the default) uploads the release
# assets as a workflow artifact instead of publishing them.
#
# The version of the release is derived from the Skia
# branch the submodule commit is on (see scripts/package-binaries.ts): m154 is
# 154.0.0, and the re-spin letter is the minor (m154_8037_58b is 154.2.0).
on:
  workflow_dispatch:
    inputs:
      skia_branch:
        description: 'Skia branch to build (e.g. chrome/m154). Leave empty to build the checked-in submodule commit.'
        required: false
        default: ''
      respin:
        description: 'Re-spin letter for another build of the same Skia branch: "a" makes the version 154.1.0, "b" 154.2.0. Leave empty for 154.0.0.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: build and package, upload the release assets as a workflow artifact, skip the GitHub release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skia_branch: ${{ steps.skia.outputs.branch }}
      skia_version: ${{ steps.version.outputs.skia_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout custom Skia branch
        if: ${{ inputs.skia_branch != '' }}
        working-directory: externals/skia
        run: |
          git fetch origin "$SKIA_BRANCH"
          git checkout FETCH_HEAD
          echo "Skia commit: $(git rev-parse HEAD)"
        env:
          SKIA_BRANCH: ${{ inputs.skia_branch }}

      # The branch the submodule commit is on, without its chrome/ prefix:
      # m154 right after a milestone bump, or the Chromium release branch
      # (m154_8037_58) once chrome/m154 has moved past the pinned commit.
      # When no branch ends at the commit any more (chrome/m154 moved on
      # before a release branch was cut from it), the first chrome/ branch
      # that contains it still names the milestone, which is all the version
      # derives from.
      - name: Determine Skia branch
        id: skia
        run: |
          set -eo pipefail
          if [ -n "$INPUT_SKIA_BRANCH" ]; then
            branch="$INPUT_SKIA_BRANCH"
          else
            branch=$(git -C externals/skia branch --show-current || true)
            if [ -z "$branch" ]; then
              branch=$(git -C externals/skia describe --all --exact-match 2>/dev/null || true)
            fi
            if [ -z "$branch" ]; then
              branch=$(git -C externals/skia branch -r --contains HEAD --list 'origin/chrome/m*' | sed 's/^[* ]*//' | sort | head -n 1)
            fi
          fi
          branch=${branch#remotes/origin/chrome/}
          branch=${branch#origin/chrome/}
          branch=${branch#chrome/}
          if [ -z "$branch" ]; then
            echo "::error::Could not determine the Skia branch of externals/skia"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
        env:
          INPUT_SKIA_BRANCH: ${{ inputs.skia_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compute the release version
        id: version
        working-directory: packages/skia
        run: |
          set -eo pipefail
          skia_version="${SKIA_BRANCH//\//-}${RESPIN}"
          version=$(yarn tsx scripts/package-binaries.ts --skia-version="$skia_version" --print-version | tail -n 1)
          echo "Skia $skia_version → binaries-$version"
          echo "skia_version=$skia_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          SKIA_BRANCH: ${{ steps.skia.outputs.branch }}
          RESPIN: ${{ inputs.respin }}

      # A published release is never replaced: the packages pin the sha256
      # of its assets. Fail before the builds rather than after them. A dry
      # run only warns: it is how a version is rebuilt for inspection.
      - name: Check that the release does not exist yet
        run: |
          set -eo pipefail
          state=$(gh release view "binaries-$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::binaries-$VERSION is already published. Bump the respin letter."
              exit 1
            fi
            echo "::warning::binaries-$VERSION is already published."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}

  # The repository is public, so the standard GitHub-hosted runners are free
  # and only the larger ones (macos-latest-xlarge) are billed. The Android
  # targets only need the NDK toolchain and build on ubuntu-latest. The Apple
  # targets build on the self-hosted Mac (an M1 Max with 64GB, shared with the
  # CI of this and two other repositories), which is both free and faster
  # than the hosted runners: it built Dawn for every Apple SDK in 7 minutes,
  # when one macos-latest job (3 cores, 7GB) took 7 to 24 minutes for a
  # single SDK. The Apple SDKs build in a single job per library (skia-apple
  # here, dawn-apple in build-dawn), which the machine's two runners run side
  # by side: ninja already uses every core, and the checkout, the dependency
  # sync and the patches happen once rather than once per SDK. The job
  # uploads them together, one subdirectory per SDK.
  build-skia:
    needs: prepare
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apple
            targets: iphoneos iphonesimulator maccatalyst appletvos appletvsimulator macos
            runner: [self-hosted, macOS]
            output: packages/skia/libs/apple
            timeout: 240
          - target: android-arm
            targets: android-arm
            runner: ubuntu-latest
            output: packages/skia/libs/android/armeabi-v7a
            timeout: 120
          - target: android-arm64
            targets: android-arm64
            runner: ubuntu-latest
            output: packages/skia/libs/android/arm64-v8a
            timeout: 120
          - target: android-x86
            targets: android-x86
            runner: ubuntu-latest
            output: packages/skia/libs/android/x86
            timeout: 120
          - target: android-x64
            targets: android-x64
            runner: ubuntu-latest
            output: packages/skia/libs/android/x86_64
            timeout: 120
    name: skia-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Checkout custom Skia branch
        if: ${{ inputs.skia_branch != '' }}
        working-directory: externals/skia
        run: |
          git fetch origin "$SKIA_BRANCH"
          git checkout FETCH_HEAD
          echo "Skia commit: $(git rev-parse HEAD)"
        env:
          SKIA_BRANCH: ${{ inputs.skia_branch }}

      # tools/git-sync-deps clones every dependency in Skia's DEPS (Dawn,
      # ANGLE, the Vulkan headers, freetype, harfbuzz, ...) from googlesource.
      # The checkout cleans the submodule on the self-hosted Mac too, so
      # without this every job clones them all again. The sync is idempotent:
      # with the clones restored it only verifies the commits, and after a
      # DEPS change (an older key) it fetches the difference into them.
      - name: Cache the Skia dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: externals/skia/third_party/externals
          key: ${{ runner.os }}-skia-deps-${{ hashFiles('externals/skia/DEPS') }}
          restore-keys: |
            ${{ runner.os }}-skia-deps-

      - name: Setup Android NDK
        id: setup-ndk
        if: startsWith(matrix.target, 'android')
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update depot_tools
        working-directory: externals/depot_tools
        run: ./update_depot_tools

      - name: Build Skia (${{ matrix.target }})
        working-directory: packages/skia
        run: yarn build-skia ${{ matrix.targets }}
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          GIT_SYNC_DEPS_SKIP_EMSDK: 'true'
          ZERO_AR_DATE: 1

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: skia-${{ matrix.target }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  # Same runners as build-skia: Android on ubuntu-latest, and every Apple SDK
  # in one job on the self-hosted Mac, uploaded together as dawn-apple.
  build-dawn:
    needs: prepare
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-armeabi-v7a
            targets: android-armeabi-v7a
            runner: ubuntu-latest
            output: packages/skia/libs/dawn/android/armeabi-v7a
            artifact: dawn-android-armeabi-v7a
            headers: false
            timeout: 120
          - target: android-arm64-v8a
            targets: android-arm64-v8a
            runner: ubuntu-latest
            output: packages/skia/libs/dawn/android/arm64-v8a
            artifact: dawn-android-arm64-v8a
            headers: false
            timeout: 120
          - target: android-x86
            targets: android-x86
            runner: ubuntu-latest
            output: packages/skia/libs/dawn/android/x86
            artifact: dawn-android-x86
            headers: false
            timeout: 120
          - target: android-x86_64
            targets: android-x86_64
            runner: ubuntu-latest
            output: packages/skia/libs/dawn/android/x86_64
            artifact: dawn-android-x86_64
            headers: false
            timeout: 120
          - target: apple
            targets: iphoneos iphonesimulator maccatalyst appletvos appletvsimulator macos
            runner: [self-hosted, macOS]
            output: packages/skia/libs/dawn/apple
            artifact: dawn-apple
            headers: true
            timeout: 240
    name: dawn-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    steps:
      # Dawn and its dependencies are checked out by build-dawn at the commits
      # Skia's DEPS pins, so the Skia checkout is needed for its DEPS and
      # tools/git-sync-deps.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Checkout custom Skia branch
        if: ${{ inputs.skia_branch != '' }}
        working-directory: externals/skia
        run: |
          git fetch origin "$SKIA_BRANCH"
          git checkout FETCH_HEAD
          echo "Skia commit: $(git rev-parse HEAD)"
        env:
          SKIA_BRANCH: ${{ inputs.skia_branch }}

      # Same as in build-skia, under its own key: sync-dawn-deps.py only
      # syncs the DEPS entries Dawn needs, so a cache saved here is a subset
      # of the one build-skia saves and must not be mistaken for it.
      - name: Cache the Dawn dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: externals/skia/third_party/externals
          key: ${{ runner.os }}-dawn-deps-${{ hashFiles('externals/skia/DEPS') }}
          restore-keys: |
            ${{ runner.os }}-dawn-deps-

      - name: Setup Android NDK
        id: setup-ndk
        if: startsWith(matrix.target, 'android')
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Dawn (${{ matrix.target }})
        working-directory: packages/skia
        run: yarn build-dawn ${{ matrix.targets }}
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

      # The headers are the same for every target; one job ships them.
      - name: Upload headers
        if: matrix.headers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: dawn-headers
          path: |
            packages/skia/libs/dawn/include
            packages/skia/libs/dawn/metadata.json
            packages/skia/libs/dawn/LICENSE
          if-no-files-found: error
          retention-days: 7

  # Archives the build outputs as the release assets and writes their
  # checksums.json. The Apple libraries are already lipo'd by the build jobs,
  # so this only needs zip.
  package:
    needs: [prepare, build-skia, build-dawn]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      # One directory per artifact under artifacts/, which package-binaries
      # stages back into packages/skia/libs. skia-apple and dawn-apple hold
      # every Apple SDK, one subdirectory each.
      - name: Download the Skia artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: skia-*
          path: artifacts

      - name: Download the Dawn artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dawn-*
          path: artifacts

      - name: Package
        working-directory: packages/skia
        run: yarn package-binaries --skia-version="$SKIA_VERSION" --artifacts=../../artifacts
        env:
          SKIA_VERSION: ${{ needs.prepare.outputs.skia_version }}

      # Android archives contain ABI directories. Apple archives carry all
      # static libraries for one SDK.
      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: release-assets
          path: packages/skia/build/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "## Binaries"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Skia | ${{ needs.prepare.outputs.skia_branch }} (${{ needs.prepare.outputs.skia_version }}) |"
            echo "| Release | binaries-${{ needs.prepare.outputs.version }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "> Dry run: nothing was published. The release assets are in the \`release-assets\` artifact of this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the GitHub release binaries-<version>, where the native build
  # systems download the binaries from. A job of its own: it
  # is the only one that can write to the repository, and it runs no code
  # from the checkout, only the GitHub CLI on the archives the package job
  # made.
  release:
    needs: [prepare, package]
    if: ${{ !inputs.dry_run && github.repository == 'wcandillon/react-native-skia' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: binaries-${{ needs.prepare.outputs.version }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SKIA_VERSION: ${{ needs.prepare.outputs.skia_version }}
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      # checksums.json is what the packages pin: it must describe every
      # asset, and nothing else is uploaded.
      - name: Verify the checksums
        working-directory: release
        run: |
          set -eo pipefail
          test "$(jq -r .tag checksums.json)" = "$TAG"
          sha256sum -c <(jq -r '.assets | to_entries[] | "\(.value.sha256)  \(.key)"' checksums.json)
          listed=$(jq -r '.assets | keys[]' checksums.json | sort)
          present=$(find . -maxdepth 1 -type f ! -name checksums.json | sed 's|^\./||' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::checksums.json does not list exactly the files of the release"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi

      # gh uploads the assets to a draft and publishes it once they are all
      # there. A published release is left alone (an immutable release could
      # not be changed anyway); a draft is what an interrupted run left behind.
      - name: Create the release
        run: |
          set -eo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "::notice::$TAG is already published, skipped"
            exit 0
          fi
          if [ "$state" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Binaries $VERSION" \
            --notes "Prebuilt Skia Graphite ($SKIA_VERSION) and Dawn binaries. Android libraries are grouped by ABI; Apple static libraries are grouped by SDK. checksums.json holds the sha256 of every asset." \
            --prerelease \
            --latest=false
          echo "Released the binaries as [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
