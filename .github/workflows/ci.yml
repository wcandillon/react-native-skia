name: CI
# Pushes to main/next only run the cheap ubuntu jobs (lint, test, test-web,
# build-library). The native builds and the emulator/simulator runs happen on
# pull requests and in the merge queue, so a merge does not pay for the full
# suite twice.
on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - run: pip install cpplint
      - run: cpplint --linelength=230 --filter=-legal/copyright,-whitespace/indent,-whitespace/comments,-whitespace/ending_newline,-build/include_order,-runtime/references,-readability/todo,-whitespace/blank_line,-whitespace/todo,-runtime/int,-build/c++11,-whitespace/parens,-build/include_what_you_use --exclude=packages/skia/cpp/skia --exclude=packages/skia/cpp/dawn --recursive packages/skia/cpp packages/skia/android/cpp

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn tsc

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: yarn test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run web example tests
        run: yarn test:web

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: web-example-screenshots
          path: apps/example/e2e/screenshots/
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: web-example-test-results
          path: apps/example/test-results/
          if-no-files-found: ignore

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package
        run: yarn build

      - name: Build dry run release
        working-directory: packages/skia
        run: |
          npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test-android:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # Keep the swap file: the Graphite C++ build peaks close to the
          # runner's 16 GB and the swap is the only headroom left.
          swap-storage: false

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Set ANDROID_NDK
        run: echo "ANDROID_NDK=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Install Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/apps/example/android/local.properties

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('./apps/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
          # Only the emulator ABI is tested below, so skip the other three.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: |
          yarn turbo run build:android --concurrency 1

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: android-example-apk
          path: apps/example/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Package Manager
        working-directory: apps/example/
        run: E2E=true yarn start &

      - name: Run Android Emulator Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 5X
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # Wait for Metro bundler
            sleep 10

            # Install and launch app
            adb install -r apps/example/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.microsoft.reacttestapp 1

            # Run tests
            # We run the Path render tests plus the WebGPU specs.
            # ArrayBuffer, ComputeShader, ErrorScope, ImageBitmapBounds and
            # DawnToggles are pure surface.eval round-trips that assert on
            # returned values. The external-texture specs (ExternalTexture,
            # ImportExternalTexture, SharedTextureMemory) additionally exercise
            # NativeBuffer import and GPU read-back; they self-validate via
            # copyTextureToBuffer (not Skia image readPixels) and skip
            # themselves where NativeBuffer/createImageBitmap are unavailable.
            cd packages/skia && CI=true yarn test -i "e2e/(Path|ArrayBuffer|ComputeShader|ErrorScope|ImageBitmapBounds|DawnToggles|ExternalTexture|ImportExternalTexture|SharedTextureMemory)" --testPathIgnorePatterns Paragraphs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        if: failure()
        with:
          path: packages/skia/src/__tests__/snapshots/
          name: tests-snapshots-screenshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        if: failure()
        with:
          path: apps/docs/static/
          name: tests-docs-screenshots

  # The iOS and macOS jobs run on the self-hosted Mac that also serves the
  # react-native-webgpu and redraw CI. Fork PRs skip them so outside code never
  # runs on that machine; the merge queue still runs them before anything lands.
  build-test-ios:
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    env:
      # The other projects on the machine use Metro on 8081 and a test server
      # on 4242, so this job runs on its own ports and its own simulator and
      # can run concurrently with them. RCT_METRO_PORT is compiled into the
      # app by xcodebuild; E2E_PORT is inlined into the JS bundle.
      METRO_PORT: 8082
      E2E_PORT: 4243
      IOS_SIMULATOR: skia-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CocoaPods
        working-directory: apps/example/ios
        run: pod install

      # Clear anything a previous or cancelled run left on this job's ports.
      - name: Ensure Metro and test server ports are free
        run: |
          lsof -ti :$METRO_PORT | xargs -r kill -9 || true
          lsof -ti :$E2E_PORT | xargs -r kill -9 || true

      # --reset-cache: Metro's transform cache lives in $TMPDIR and survives
      # between runs on the self-hosted machine. A stale cache would serve JS
      # built by an older Babel transform (e.g. a worklets version mismatch
      # after a bump) or with a previously inlined E2E_PORT.
      - name: Start Package Manager
        working-directory: apps/example
        run: E2E=true yarn start --port $METRO_PORT --reset-cache &

      # A dedicated simulator, created once on the newest iOS runtime, so this
      # job never shares a device with the other repositories on the machine.
      - name: Prepare iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r --arg name "$IOS_SIMULATOR" '
            .devices[] | .[] | select(.name == $name) | .udid' | head -n 1)
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available --json | jq -r '
              .runtimes | map(select(.platform == "iOS")) | sort_by(.version) | last | .identifier')
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r '
              .devicetypes | map(select(.name | test("^iPhone [0-9]+ Pro$"))) | last | .identifier')
            echo "Creating $IOS_SIMULATOR ($DEVICE_TYPE, $RUNTIME)"
            UDID=$(xcrun simctl create "$IOS_SIMULATOR" "$DEVICE_TYPE" "$RUNTIME")
          fi
          echo "Using simulator $IOS_SIMULATOR ($UDID)"
          echo "IOS_SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          # Never test against a binary left over from a previous run.
          xcrun simctl uninstall "$UDID" com.microsoft.ReactTestApp || true

      # Plain xcodebuild rather than `yarn ios`: the CLI insists on opening
      # Simulator.app from the Xcode bundle, which Xcode 27 no longer ships
      # there, and a headless booted simulator is all the tests need.
      # RCT_METRO_PORT feeds React-Core's GCC_PREPROCESSOR_DEFINITIONS.
      - name: Build example for iOS
        working-directory: apps/example/ios
        run: |
          set -o pipefail && xcodebuild \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            RCT_METRO_PORT=$METRO_PORT \
            build | tee xcodebuild.log | xcpretty || {
              # xcpretty drops some errors (e.g. project-level ones), so show
              # them from the raw log.
              grep -E "error:|fatal error" xcodebuild.log | sort -u | head -50
              exit 1
            }

      - name: Install and launch app on simulator
        run: |
          xcrun simctl install "$IOS_SIMULATOR_UDID" apps/example/ios/build/Build/Products/Debug-iphonesimulator/ReactTestApp.app
          xcrun simctl launch "$IOS_SIMULATOR_UDID" com.microsoft.ReactTestApp

      - name: Run e2e tests
        working-directory: packages/skia
        run: CI=true yarn e2e --testPathIgnorePatterns "Paragraph"

      # Stop Metro and shut the simulator down so they don't hold memory
      # while the machine runs the other repositories' jobs.
      - name: Clean up
        if: always()
        run: |
          lsof -ti :$METRO_PORT | xargs -r kill -9 || true
          lsof -ti :$E2E_PORT | xargs -r kill -9 || true
          if [ -n "$IOS_SIMULATOR_UDID" ]; then
            xcrun simctl shutdown "$IOS_SIMULATOR_UDID" || true
          fi

  build-test-macos:
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build example for macOS
        run: yarn turbo run build:macos --concurrency 1
