name: Release Skia wasm
# Builds Skia Graphite for the browser's WebGPU (`yarn build-skia wasm`) and
# archives it as skia-graphite-wasm.zip (`yarn package-skia-wasm`): the
# archives, the Skia headers, the emdawnwebgpu package and metadata.json.
# The archive is the asset of the GitHub release skia-wasm-<version>, which
# the skia-wasm repository (https://github.com/wcandillon/skia-wasm) pins in
# its binaries.json and downloads from. A dry run (the default) uploads the
# archive as a workflow artifact instead of releasing it.
#
# Separate from build-binaries.yml: the wasm archives are not part of the npm
# packages and are released on their own schedule.
#
# The version is the Skia branch the submodule commit is on, as in
# build-binaries.yml (m154, or m154_8037_58 for a release branch), plus the
# re-spin letter for another build of the same branch.
on:
  workflow_dispatch:
    inputs:
      skia_branch:
        description: 'Skia branch to build (e.g. chrome/m154). Leave empty to build the checked-in submodule commit.'
        required: false
        default: ''
      respin:
        description: 'Re-spin letter for another build of the same Skia branch: "a" releases skia-wasm-m154a. Leave empty for skia-wasm-m154.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: build and package, upload the archive as a workflow artifact, skip the GitHub release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout custom Skia branch
        if: ${{ inputs.skia_branch != '' }}
        working-directory: externals/skia
        run: |
          git fetch origin "$SKIA_BRANCH"
          git checkout FETCH_HEAD
          echo "Skia commit: $(git rev-parse HEAD)"
        env:
          SKIA_BRANCH: ${{ inputs.skia_branch }}

      # The same derivation as the prepare job of build-binaries.yml.
      - name: Determine the version
        id: version
        run: |
          set -eo pipefail
          if [ -n "$INPUT_SKIA_BRANCH" ]; then
            branch="$INPUT_SKIA_BRANCH"
          else
            branch=$(git -C externals/skia branch --show-current || true)
            if [ -z "$branch" ]; then
              branch=$(git -C externals/skia describe --all --exact-match 2>/dev/null || true)
            fi
            if [ -z "$branch" ]; then
              branch=$(git -C externals/skia branch -r --contains HEAD --list 'origin/chrome/m*' | sed 's/^[* ]*//' | sort | head -n 1)
            fi
          fi
          branch=${branch#remotes/origin/chrome/}
          branch=${branch#origin/chrome/}
          branch=${branch#chrome/}
          if [ -z "$branch" ]; then
            echo "::error::Could not determine the Skia branch of externals/skia"
            exit 1
          fi
          version="${branch//\//-}${RESPIN}"
          echo "Skia $branch → skia-wasm-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          INPUT_SKIA_BRANCH: ${{ inputs.skia_branch }}
          RESPIN: ${{ inputs.respin }}

      # skia-wasm pins the archive by checksum, so a published release is
      # never replaced: fail before the build rather than after it. A dry run
      # only warns: it is how a released version is rebuilt for inspection.
      - name: Check the release does not exist
        run: |
          state=$(gh release view "skia-wasm-$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::skia-wasm-$VERSION is already released. Set a re-spin letter to release another build."
              exit 1
            fi
            echo "::warning::skia-wasm-$VERSION is already released; this dry run rebuilds it."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}

  # The wasm build has only been run on macOS so far, so it runs on the
  # self-hosted Mac like the Apple targets of build-binaries.yml: free, and
  # faster than the hosted runners. The standard macos-latest runner, free
  # for this public repository too, is the fallback if the machine is
  # unavailable.
  build:
    needs: prepare
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive

      - name: Checkout custom Skia branch
        if: ${{ inputs.skia_branch != '' }}
        working-directory: externals/skia
        run: |
          git fetch origin "$SKIA_BRANCH"
          git checkout FETCH_HEAD
          echo "Skia commit: $(git rev-parse HEAD)"
        env:
          SKIA_BRANCH: ${{ inputs.skia_branch }}

      # Its own key: the native builds skip emsdk (GIT_SYNC_DEPS_SKIP_EMSDK),
      # so their cache lacks it, while this one also keeps the Emscripten
      # release bin/activate-emsdk installs into the emsdk checkout.
      - name: Cache the Skia dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: externals/skia/third_party/externals
          key: ${{ runner.os }}-skia-wasm-deps-${{ hashFiles('externals/skia/DEPS', 'externals/skia/bin/activate-emsdk') }}
          restore-keys: |
            ${{ runner.os }}-skia-wasm-deps-

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update depot_tools
        working-directory: externals/depot_tools
        run: ./update_depot_tools

      - name: Build Skia (wasm)
        working-directory: packages/skia
        run: yarn build-skia wasm
        env:
          ZERO_AR_DATE: 1

      - name: Package
        working-directory: packages/skia
        run: yarn package-skia-wasm --output=build/wasm

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0
        with:
          name: skia-graphite-wasm
          path: |
            packages/skia/build/wasm/skia-graphite-wasm.zip
            packages/skia/libs/wasm/metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summary
        if: always()
        working-directory: packages/skia
        run: |
          {
            echo "## Skia wasm"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | skia-wasm-$VERSION |"
            echo "| Dry run | $DRY_RUN |"
            if [ -f libs/wasm/metadata.json ]; then
              node -p 'const m = require("./libs/wasm/metadata.json"); `| Skia | ${m.skia.commit} |\n| Dawn | ${m.dawn.commit} |\n| Emscripten | ${m.emscripten} |`'
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo ""
              echo "> Dry run: nothing was released. The archive is in the \`skia-graphite-wasm\` artifact of this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}

  # A job of its own, as in build-binaries.yml: it is the only one that can
  # write to the repository, and it runs no code from the checkout, only the
  # GitHub CLI on the archive the build job made.
  release:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run && github.repository == 'wcandillon/react-native-skia' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: skia-wasm-${{ needs.prepare.outputs.version }}
      ASSET: skia-graphite-wasm.zip
    steps:
      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skia-graphite-wasm
          path: release

      # Checked again in case a release appeared during the build. A draft is
      # what an interrupted run left behind.
      - name: Create the release
        run: |
          set -eo pipefail
          archive=$(find release -name "$ASSET" -type f)
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "::error::$TAG is already released. Set a re-spin letter to release another build."
            exit 1
          fi
          if [ "$state" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          emscripten=$(jq -r .emscripten "$(find release -name metadata.json -type f)")
          gh release create "$TAG" "$archive" \
            --target "$GITHUB_SHA" \
            --title "Skia wasm ${TAG#skia-wasm-}" \
            --notes "Skia Graphite for the browser's WebGPU, built with Emscripten $emscripten: static wasm archives, the Skia headers, the emdawnwebgpu package and metadata.json. Consumed by https://github.com/wcandillon/skia-wasm." \
            --prerelease \
            --latest=false

          sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
          size=$(stat -c %s "$archive")
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          {
            echo "Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG). Pin it in binaries.json of skia-wasm:"
            echo ""
            echo '```json'
            jq -n --arg asset "$ASSET" --arg url "$url" --arg sha256 "$sha256" --argjson size "$size" \
              '{($asset): {url: $url, sha256: $sha256, size: $size}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
