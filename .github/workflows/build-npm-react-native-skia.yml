name: Create a release (react-native-skia)
on:
  workflow_dispatch:
    inputs:
      graphite:
        description: 'Ship the Graphite build (Dawn/WebGPU backend) instead of the default Ganesh build. Ignored on 2.x, which always ships Ganesh.'
        type: boolean
        default: true
      skip_npm_publish:
        description: 'Skip the npm publish and upload the package tarball as a workflow artifact instead'
        type: boolean
        default: false
      version:
        description: 'Release this exact version (e.g. 3.0.0) instead of letting semantic-release compute it. Leave empty for a regular release.'
        type: string
        required: false
        default: ''
jobs:
  build:
    if: ${{ github.repository == 'wcandillon/react-native-skia' && (github.ref_name == 'main' || github.ref_name == '2.x') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    env:
      WORKING_DIRECTORY: ./
      PACKAGE_NAME: react-native-skia
      REPOSITORY: wcandillon/react-native-skia
      # 2.x is the maintenance branch for the Ganesh v2 line: it never ships
      # Graphite and publishes under the release-2.x dist-tag so latest stays on
      # main (npm rejects dist-tags that are a valid semver range, such as 2.x).
      GRAPHITE: ${{ inputs.graphite && github.ref_name != '2.x' }}
      NPM_DIST_TAG: ${{ github.ref_name == '2.x' && 'release-2.x' || 'latest' }}
    concurrency:
      group: npm-react-native-skia-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      # The graphite setup bakes the Dawn and Graphite headers into cpp/ and
      # creates the libs/.graphite marker (shipped via the files field) that the
      # podspec and build.gradle key off at build time.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          graphite: ${{ env.GRAPHITE }}

      - name: Build package and documentation
        run: yarn build

      # Swap the prebuilt binary packages for their Graphite variants, pinned in
      # graphiteDependencies (package.json).
      - name: Swap in Graphite binary packages
        if: ${{ env.GRAPHITE == 'true' }}
        working-directory: packages/skia
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const name of Object.keys(pkg.dependencies)) {
              if (name.startsWith('react-native-skia-')) delete pkg.dependencies[name];
            }
            Object.assign(pkg.dependencies, pkg.graphiteDependencies);
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node -p "JSON.stringify(require('./package.json').dependencies, null, 2)"

      # Configure semantic-release for this repository. The workspace keeps its
      # @shopify/react-native-skia name (the apps depend on it), so the packed
      # tarball is renamed to react-native-skia right after semantic-release-yarn
      # writes it to dist/, before it is published and attached to the release.
      # The 2.x branch is a maintenance branch (>=2.0.0 <3.0.0) on the release-2.x
      # channel, which is also its npm dist-tag.
      # Commenting on released issues and PRs is off: the commit messages
      # reference Shopify/react-native-skia numbers that don't exist here.
      - name: Configure semantic-release
        if: ${{ inputs.version == '' }}
        working-directory: packages/skia
        run: |
          node -e "
            const fs = require('fs');
            const rc = JSON.parse(fs.readFileSync('.releaserc', 'utf8'));
            rc.repositoryUrl = 'https://github.com/' + process.env.REPOSITORY + '.git';
            rc.branches.unshift({ name: '2.x', range: '2.x', channel: 'release-2.x' });
            const exec = rc.plugins.find((p) => Array.isArray(p) && p[0] === '@semantic-release/exec');
            exec[1].prepareCmd = 'bash ../../.github/scripts/rename-package-tarball.sh dist';
            if (process.env.SKIP_NPM_PUBLISH === 'true') delete exec[1].publishCmd;
            const github = rc.plugins.find((p) => Array.isArray(p) && p[0] === '@semantic-release/github');
            github[1].successCommentCondition = false;
            github[1].failCommentCondition = false;
            fs.writeFileSync('.releaserc', JSON.stringify(rc, null, 2) + '\n');
          "
          cat .releaserc
        env:
          SKIP_NPM_PUBLISH: ${{ inputs.skip_npm_publish }}

      - name: Build NPM Package
        if: ${{ inputs.version == '' }}
        working-directory: packages/skia
        run: |
          yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true

      # semantic-release publishes its GitHub releases as the latest one. After
      # a 2.x release, hand that back to the version npm serves as latest.
      - name: Keep the latest GitHub release on main
        if: ${{ inputs.version == '' && github.ref_name == '2.x' }}
        run: gh release edit "v$(npm view "$PACKAGE_NAME" dist-tags.latest)" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bootstrap path: release an exact version and push the matching vX.Y.Z
      # tag so that semantic-release picks up from it on the next regular run.
      - name: Build NPM Package (explicit version)
        if: ${{ inputs.version != '' }}
        working-directory: packages/skia
        run: |
          VERSION="${INPUT_VERSION#v}"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists" && exit 1
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          mkdir -p dist
          yarn pack --out dist/package.tgz
          bash ../../.github/scripts/rename-package-tarball.sh dist
          if [ "$SKIP_NPM_PUBLISH" != "true" ]; then
            mkdir -p /tmp/npm-publish && cp dist/*.tgz /tmp/npm-publish/
            (cd /tmp/npm-publish && npm publish *.tgz --provenance --access public --tag "$NPM_DIST_TAG")
          fi
          git tag "$TAG"
          git push origin "$TAG"
          if [ "$NPM_DIST_TAG" = "latest" ]; then LATEST=true; else LATEST=false; fi
          gh release create "$TAG" dist/*.tgz --title "$TAG" --generate-notes --latest="$LATEST"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SKIP_NPM_PUBLISH: ${{ inputs.skip_npm_publish }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Upload package tarball
        if: ${{ inputs.skip_npm_publish }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v6.0.0
        with:
          name: react-native-skia-tarball
          path: packages/skia/dist/*.tgz
          if-no-files-found: error
